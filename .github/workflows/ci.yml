name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/

      - name: Test
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t ad-analytics-api:ci .

      # Deployment step (Render/Fly) is added once the hosted service
      # exists — see implementation plan v0.1 deploy checkpoint. Keeping
      # this job as "build only" for now means CI never blocks on deploy
      # credentials that don't exist yet.
