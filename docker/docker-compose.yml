version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=local
    depends_on:
      - clickhouse
    restart: unless-stopped

  # Schema is created via migrations (app/db/migrations/), applied by
  # running `python -m app.db.run_migrations` against this container —
  # see README for the exact docker compose exec command.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # native client interface
    environment:
      - CLICKHOUSE_DB=ad_analytics
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=local
    depends_on:
      - clickhouse
    restart: unless-stopped

volumes:
  clickhouse_data:
